<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Website under making. Rohan Graphics is preparing its printing and design business website."
    />
    <title>Rohan Graphics | Website Under Making</title>
    <style>
      :root {
        --primary: #1f3a5f;
        --primary-light: #2e5c8a;
        --accent: #f4b942;
        --dark: #111827;
        --text: #374151;
        --muted: #6b7280;
        --light: #f8fafc;
        --white: #ffffff;
        --shadow: 0 12px 30px rgba(17, 24, 39, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: var(--white);
        line-height: 1.6;
      }

      a {
        text-decoration: none;
      }

      img {
        max-width: 100%;
        display: block;
      }

      .container {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .topbar {
        background: var(--dark);
        color: var(--white);
        padding: 12px 0;
        font-size: 0.9rem;
      }

      .topbar-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }

      .topbar span {
        opacity: 0.9;
      }

      .topbar a {
        color: var(--white);
        opacity: 0.9;
      }

      header {
        background: rgba(255, 255, 255, 0.96);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(17, 24, 39, 0.06);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 78px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: 0.04em;
      }

      .logo {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: var(--white);
        font-size: 1.15rem;
        font-weight: 700;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .nav-links a {
        color: var(--text);
        font-weight: 600;
      }

      .nav-links a:hover {
        color: var(--primary);
      }

      .btn {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 999px;
        font-weight: 700;
        transition: all 0.2s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--white);
        box-shadow: var(--shadow);
      }

      .btn-primary:hover {
        background: var(--primary-light);
      }

      .btn-light {
        background: var(--white);
        color: var(--primary);
      }

      .hero {
        background: linear-gradient(120deg, rgba(31, 58, 95, 0.96), rgba(46, 92, 138, 0.9)),
          url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
        color: var(--white);
        padding: 100px 0 80px;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        align-items: center;
        gap: 50px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(2.5rem, 5vw, 4.4rem);
        line-height: 1.1;
        margin: 0 0 18px;
      }

      .hero p {
        font-size: 1.08rem;
        max-width: 620px;
        color: rgba(255, 255, 255, 0.84);
        margin-bottom: 30px;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 34px;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        margin-bottom: 4px;
      }

      .stat span {
        color: rgba(255, 255, 255, 0.8);
      }

      .hero-card {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px;
        backdrop-filter: blur(8px);
      }

      .mini-card {
        background: var(--white);
        color: var(--dark);
        padding: 20px;
        border-radius: 18px;
        margin-bottom: 16px;
      }

      .mini-card:last-child {
        margin-bottom: 0;
      }

      .mini-card h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }

      .mini-card p {
        margin: 0;
        color: var(--muted);
      }

      section {
        padding: 90px 0;
      }

      .section-head {
        text-align: center;
        max-width: 700px;
        margin: 0 auto 40px;
      }

      .section-head h2 {
        color: var(--dark);
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 14px;
      }

      .section-head p {
        margin: 0;
        color: var(--muted);
      }

      .services {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 28px;
      }

      .service-card {
        background: var(--light);
        border: 1px solid rgba(17, 24, 39, 0.06);
        border-radius: 22px;
        padding: 32px 24px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .service-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow);
      }

      .icon {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        background: rgba(31, 58, 95, 0.1);
        border-radius: 16px;
        font-size: 1.5rem;
        margin-bottom: 18px;
      }

      .service-card h3 {
        margin: 0 0 10px;
        color: var(--dark);
      }

      .service-card p {
        margin: 0;
        color: var(--muted);
      }

      .about {
        background: #f7f9fc;
      }

      .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 42px;
        align-items: center;
      }

      .about-image {
        border-radius: 26px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .about-image img {
        width: 100%;
        height: 520px;
        object-fit: cover;
      }

      .about-content h2 {
        margin: 0 0 18px;
        color: var(--dark);
        font-size: clamp(2rem, 3vw, 2.7rem);
      }

      .about-content p {
        color: var(--muted);
        margin: 0 0 18px;
      }

      .check-list {
        list-style: none;
        padding: 0;
        margin: 28px 0 0;
      }

      .check-list li {
        position: relative;
        padding-left: 32px;
        margin-bottom: 14px;
        color: var(--text);
        font-weight: 600;
      }

      .check-list li::before {
        content: "✓";
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(244, 185, 66, 0.18);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 700;
      }

      .contact-box {
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        border-radius: 26px;
        padding: 44px 32px;
        color: var(--white);
        display: grid;
        grid-template-columns: 1.4fr 0.8fr;
        gap: 28px;
        align-items: center;
      }

      .contact-box h2 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.6rem);
      }

      .contact-box p {
        margin: 0;
        color: rgba(255, 255, 255, 0.85);
      }

      footer {
        background: var(--dark);
        color: rgba(255, 255, 255, 0.8);
        padding: 28px 0;
      }

      .footer-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
      }

      .footer-links {
        display: flex;
        gap: 18px;
      }

      .footer-links a {
        color: rgba(255, 255, 255, 0.8);
      }

      @media (max-width: 900px) {
        .hero-grid,
        .about-grid,
        .contact-box,
        .services {
          grid-template-columns: 1fr;
        }

        .nav {
          flex-wrap: wrap;
          justify-content: center;
          padding: 18px 0;
        }

        .nav-links {
          width: 100%;
          justify-content: center;
          flex-wrap: wrap;
          gap: 14px 18px;
          padding-bottom: 10px;
        }
      }

      @media (max-width: 560px) {
        .topbar-inner,
        .footer-row {
          flex-direction: column;
          text-align: center;
        }

        .hero {
          padding-top: 80px;
        }

        .stats {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="coming-soon-wrap">
      <div class="pulse-dot"></div>
      <h1>WEBSITE UNDER MAKING</h1>
    </div>

    <style>
      :root {
        --bg: #f4f6fb;
        --text: #111827;
        --accent: #1f3a5f;
        --glow: rgba(31, 58, 95, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, var(--bg));
        font-family: Arial, Helvetica, sans-serif;
      }

      .coming-soon-wrap {
        position: relative;
        text-align: center;
        padding: 30px 24px;
        animation: fadeInUp 1s ease-out;
      }

      .pulse-dot {
        width: 18px;
        height: 18px;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 var(--glow);
        animation: pulse 1.8s infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 6rem);
        line-height: 1.1;
        color: var(--text);
        letter-spacing: 0.08em;
        font-weight: 800;
        text-shadow: 0 8px 20px rgba(17, 24, 39, 0.08);
        animation: textFloat 2.2s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(31, 58, 95, 0.4);
          transform: scale(1);
        }
        60% {
          box-shadow: 0 0 0 18px rgba(31, 58, 95, 0);
          transform: scale(1.08);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(31, 58, 95, 0);
          transform: scale(1);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes textFloat {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-8px);
        }
      }
    </style>
  </body>
</html>
